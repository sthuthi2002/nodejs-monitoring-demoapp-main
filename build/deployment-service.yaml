apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-monitoring-demoapp
  labels:
    app: nodejs-monitoring-demoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-monitoring-demoapp
  template:
    metadata:
      labels:
        app: nodejs-monitoring-demoapp
    spec:
      containers:
        - name: nodejs-monitoring-demoapp
          image: <YOUR_DOCKERHUB_USERNAME>/nodejs-monitoring-demoapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-monitoring-demoapp-service
  labels:
    app: nodejs-monitoring-demoapp
spec:
  type: NodePort
  selector:
    app: nodejs-monitoring-demoapp
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 32000
