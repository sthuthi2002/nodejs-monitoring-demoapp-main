apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-monitoring-demoapp
  labels:
    app: nodejs-monitoring-demoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-monitoring-demoapp
  template:
    metadata:
      labels:
        app: nodejs-monitoring-demoapp
    spec:
      containers:
      - name: nodejs-monitoring-demoapp
        image: <YOUR_DOCKERHUB_USERNAME>/nodejs-monitoring-demoapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
